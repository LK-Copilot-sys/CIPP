services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"

  web-proxy:
    image: nginx:alpine
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    labels:
      - coolify.managed=true
